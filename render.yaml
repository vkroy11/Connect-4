services:
  - type: web
    name: connect-four-backend
    runtime: node
    plan: free
    region: oregon
    rootDir: Backend/connect-four/server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: CORS_ORIGIN
        value: https://connect-four-xi-six.vercel.app,http://localhost:5173
